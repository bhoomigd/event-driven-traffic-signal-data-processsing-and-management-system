<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>My Profile</h3>
    </div>
    <div class="row">
        <div class="col-md-4 text-center">
            <img [src]="auth.state.userDetails()?.image || 'assets/profile.png'" alt="Profile Picture" class="rounded-circle mb-3" width="150" height="150">
        </div>
        <div class="col-md-8">
            <table class="table table-bordered">
                <tbody>
                    <tr>
                        <th scope="row">Username</th>
                        <td>{{ auth.state.userDetails()?.username }}</td>
                    </tr>
                    <tr>
                        <th scope="row">First Name</th>
                        <td>{{ auth.state.userDetails()?.firstName }}</td>
                    </tr>
                    <tr>
                        <th scope="row">Last Name</th>
                        <td>{{ auth.state.userDetails()?.lastName }}</td>
                    </tr>
                    <tr>
                        <th scope="row">Email</th>
                        <td>{{ auth.state.userDetails()?.email }}</td>
                    </tr>
                    <tr>
                        <th scope="row">Gender</th>
                        <td>{{ auth.state.userDetails()?.gender }}</td>
                    </tr>
                    <tr>
                        <th scope="row">Phone</th>
                        <td>{{ auth.state.userDetails()?.phone }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
