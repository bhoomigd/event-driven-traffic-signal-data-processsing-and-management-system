<div class="card shadow-lg border-0 rounded-4">
    <div class="card-body p-5">
        <h2 class="card-title text-center mb-4 fw-bold text-primary">Login</h2>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold text-secondary">Username</label>
                <input type="text" id="username" name="username" [(ngModel)]="credentials.username" required
                    class="form-control form-control-lg bg-light border-0" placeholder="Enter username">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-bold text-secondary">Password</label>
                <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required
                    class="form-control form-control-lg bg-light border-0" placeholder="Enter password">
            </div>

            @if (auth.error()) {
            <div class="alert alert-danger d-flex align-items-center mb-4 border-0" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <div>{{ auth.error() }}</div>
            </div>
            }

            <button type="submit" [disabled]="auth.isLoading() || !loginForm.valid"
                class="btn btn-primary btn-lg w-100 fw-bold shadow-sm py-3">
                @if (auth.isLoading()) {
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Signing in...
                } @else {
                Sign In
                }
            </button>
        </form>

        <!-- <div class="mt-4 text-center">
            <p class="text-muted small">
                Hint: Use <strong>emilys</strong> / <strong>emilyspass</strong>
            </p>
        </div> -->
    </div>
</div>
