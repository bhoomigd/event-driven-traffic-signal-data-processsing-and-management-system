spring.application.name=delimited-file-parser-app
server.port=9091

## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url = jdbc:mysql://localhost:3306/delimitedFileParserBatchTrafficDB?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = root
spring.datasource.password = password
spring.datasource.platform=mysql
spring.datasource.initialization-mode=always
## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = create

#below property.if set to false , automatically spring batch will not run, we need to manually run through controller
#if set to true or if we comment below property , automatically spring batch will run and pick the jobparams from edit configurations mentioned in intellij
spring.batch.job.enabled=false

spring.batch.jdbc.initialize-schema=ALWAYS

send.to.kafka.topic=true
